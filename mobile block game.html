<html>
<head>
    <title>Dodge Survival Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; touch-action: none; }
        canvas { display: block; }

        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .stick {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            left: 30px;
            top: 30px;
        }

        #leftJoy { bottom: 40px; left: 40px; }
        #rightJoy { bottom: 40px; right: 40px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="leftJoy" class="joystick"><div class="stick" id="leftStick"></div></div>
<div id="rightJoy" class="joystick"><div class="stick" id="rightStick"></div></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

/* ZOOM OUT */
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
ctx.scale(0.8, 0.8); // 👈 zoom out

const PROJECTILE_SPEED = 5;
const WALL_COUNT = 10;
const ORBIT_COUNT = 16;
const RANDOM_PROJECTILE_CHANCE = 0.03;

let gameStarted = true; // auto start on mobile

let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    speed: 4
};

/* JOYSTICK STATE */
let moveInput = { x: 0, y: 0 };
let shootInput = { x: 0, y: 0 };

/* JOYSTICK HANDLING */
function setupJoystick(baseId, stickId, output) {
    const base = document.getElementById(baseId);
    const stick = document.getElementById(stickId);

    base.addEventListener("touchmove", e => {
        const rect = base.getBoundingClientRect();
        const touch = e.touches[0];

        let x = touch.clientX - rect.left - 60;
        let y = touch.clientY - rect.top - 60;

        const dist = Math.hypot(x, y);
        const max = 40;

        if (dist > max) {
            x = (x / dist) * max;
            y = (y / dist) * max;
        }

        stick.style.left = (x + 30) + "px";
        stick.style.top = (y + 30) + "px";

        output.x = x / max;
        output.y = y / max;
    });

    base.addEventListener("touchend", () => {
        stick.style.left = "30px";
        stick.style.top = "30px";
        output.x = 0;
        output.y = 0;
    });
}

setupJoystick("leftJoy", "leftStick", moveInput);
setupJoystick("rightJoy", "rightStick", shootInput);

/* GAME */
let bossProjectiles = [];
let playerBullets = [];

let boss = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 80,
    angle: 0,
    radius: 150,
    centerX: canvas.width / 2,
    centerY: canvas.height / 2,
    hp: 4000
};

let currentAttack = "idle";
let attackTimer = 300;
let warningTime = 80;
let nextAttack = "wall";

let health = 3;
let maxHealth = 3;

let invincible = false;
let invincibleTimer = 0;

let gameOver = false;
let victory = false;

let reflectMode = false;

/* SHOOT AUTO */
function shoot() {
    if (shootInput.x === 0 && shootInput.y === 0) return;

    let angle = Math.atan2(shootInput.y, shootInput.x);

    playerBullets.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        size: 6,
        speed: 8,
        dx: Math.cos(angle),
        dy: Math.sin(angle),
        damage: 20
    });
}

function hit(a, b) {
    return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
    );
}

function wallAttack() {
    let dir = Math.random() < 0.5 ? -1 : 1;

    for (let i = 0; i < WALL_COUNT; i++) {
        let y = (canvas.height / WALL_COUNT) * i;

        bossProjectiles.push({
            x: dir === 1 ? 0 : canvas.width,
            y,
            size: 12,
            speed: PROJECTILE_SPEED,
            dx: dir,
            dy: 0
        });
    }
}

function reflectAttack() {
    reflectMode = true;
    setTimeout(() => reflectMode = false, 1500);
}

let orbitAngle = 0;

function orbitAttack() {
    for (let i = 0; i < ORBIT_COUNT; i++) {
        let angle = orbitAngle + (i * (Math.PI * 2 / ORBIT_COUNT));

        bossProjectiles.push({
            x: boss.x,
            y: boss.y,
            size: 10,
            speed: PROJECTILE_SPEED,
            dx: Math.cos(angle),
            dy: Math.sin(angle)
        });
    }
    orbitAngle += 0.25;
}

function randomProjectile() {
    let angle = Math.random() * Math.PI * 2;

    bossProjectiles.push({
        x: boss.x,
        y: boss.y,
        size: 8,
        speed: PROJECTILE_SPEED - 1,
        dx: Math.cos(angle),
        dy: Math.sin(angle)
    });
}

function updateBoss() {
    if (currentAttack === "warning") return;

    boss.angle += 0.02;
    boss.x = boss.centerX + Math.cos(boss.angle) * boss.radius;
    boss.y = boss.centerY + Math.sin(boss.angle) * boss.radius;
}

let shootCooldown = 0;

function update() {
    if (gameOver || victory) return;

    /* MOVEMENT */
    player.x += moveInput.x * player.speed;
    player.y += moveInput.y * player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    updateBoss();

    if (Math.random() < RANDOM_PROJECTILE_CHANCE) randomProjectile();

    /* AUTO SHOOT */
    shootCooldown--;
    if (shootCooldown <= 0) {
        shoot();
        shootCooldown = 10;
    }

    for (let b of playerBullets) {
        b.x += b.dx * b.speed;
        b.y += b.dy * b.speed;

        if (hit(b, boss)) {
            if (!reflectMode) boss.hp -= b.damage;
            b.x = -9999;
        }
    }

    for (let p of bossProjectiles) {
        p.x += p.dx * p.speed;
        p.y += p.dy * p.speed;

        if (hit(p, player) && !invincible) {
            health--;
            invincible = true;
            invincibleTimer = 45;
        }
    }

    if (invincible) {
        invincibleTimer--;
        if (invincibleTimer <= 0) invincible = false;
    }

    attackTimer--;

    if (attackTimer === warningTime) currentAttack = "warning";

    if (attackTimer <= 0) {
        if (nextAttack === "wall") {
            wallAttack();
            nextAttack = "reflect";
        } else if (nextAttack === "reflect") {
            reflectAttack();
            nextAttack = "orbit";
        } else {
            orbitAttack();
            nextAttack = "wall";
        }

        attackTimer = 300;
        currentAttack = "idle";
    }

    if (boss.hp <= 0) victory = true;
    if (health <= 0) gameOver = true;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.fillStyle = "blue";
    for (let b of playerBullets) {
        ctx.fillRect(b.x, b.y, b.size, b.size);
    }

    ctx.fillStyle = "red";
    for (let p of bossProjectiles) {
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    ctx.fillStyle = "yellow";
    ctx.fillRect(boss.x, boss.y, boss.size, boss.size);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
