<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dodge Survival Mobile</title>

<style>
body { margin:0; overflow:hidden; background:black; touch-action:none; }
canvas { display:block; }

/* MOVE */
#moveBase {
    position:absolute;
    bottom:60px;
    left:60px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
}
#moveStick {
    position:absolute;
    width:50px;
    height:50px;
    background:white;
    border-radius:50%;
    top:35px;
    left:35px;
}

/* FIRE */
#fireBase {
    position:absolute;
    bottom:60px;
    right:60px;
    width:120px;
    height:120px;
    background:rgba(255,0,0,0.1);
    border-radius:50%;
}
#fireStick {
    position:absolute;
    width:50px;
    height:50px;
    background:red;
    border-radius:50%;
    top:35px;
    left:35px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="moveBase"><div id="moveStick"></div></div>
<div id="fireBase"><div id="fireStick"></div></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let gameStarted = false;

// ---------------- PLAYER ----------------
let player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size:20,
    speed:5
};

// ---------------- BOSS ----------------
let boss = {
    x: canvas.width/2,
    y: canvas.height/2,
    size:80,
    angle:0,
    radius:150,
    centerX:canvas.width/2,
    centerY:canvas.height/2,
    hp:4000,
    color:"white"
};

let bossProjectiles = [];
let playerBullets = [];

// ---------------- JOYSTICK INPUT ----------------
let moveX=0, moveY=0;
let aimX=0, aimY=0;
let firing=false;

let moveTouch=null;
let fireTouch=null;

// ---------------- FIRE RATE ----------------
let fireCooldown=0;
const FIRE_RATE=200;

// ---------------- PC ATTACK SYSTEM (UNCHANGED LOGIC) ----------------
let attackTimer=300;
let warningTime=80;
let nextAttack="wall";
let currentAttack="idle";

let orbitAngle=0;

// ---------------- MOVE JOYSTICK ----------------
const moveBase=document.getElementById("moveBase");
const moveStick=document.getElementById("moveStick");

moveBase.addEventListener("touchstart",e=>{
    moveTouch=e.changedTouches[0].identifier;
});

moveBase.addEventListener("touchmove",e=>{
    for(let t of e.touches){
        if(t.identifier!==moveTouch) continue;

        let r=moveBase.getBoundingClientRect();

        let dx=t.clientX-(r.left+60);
        let dy=t.clientY-(r.top+60);

        let dist=Math.min(40,Math.hypot(dx,dy));
        let ang=Math.atan2(dy,dx);

        moveX=Math.cos(ang)*(dist/40);
        moveY=Math.sin(ang)*(dist/40);

        moveStick.style.left=35+moveX*40+"px";
        moveStick.style.top=35+moveY*40+"px";
    }
});

moveBase.addEventListener("touchend",()=>{
    moveTouch=null;
    moveX=moveY=0;
    moveStick.style.left="35px";
    moveStick.style.top="35px";
});

// ---------------- FIRE JOYSTICK ----------------
const fireBase=document.getElementById("fireBase");
const fireStick=document.getElementById("fireStick");

fireBase.addEventListener("touchstart",e=>{
    fireTouch=e.changedTouches[0].identifier;
    firing=true;
});

fireBase.addEventListener("touchmove",e=>{
    for(let t of e.touches){
        if(t.identifier!==fireTouch) continue;

        let r=fireBase.getBoundingClientRect();

        let dx=t.clientX-(r.left+60);
        let dy=t.clientY-(r.top+60);

        let dist=Math.min(40,Math.hypot(dx,dy));
        let ang=Math.atan2(dy,dx);

        aimX=Math.cos(ang);
        aimY=Math.sin(ang);

        fireStick.style.left=35+aimX*40+"px";
        fireStick.style.top=35+aimY*40+"px";
    }
});

fireBase.addEventListener("touchend",()=>{
    fireTouch=null;
    firing=false;
    aimX=aimY=0;
    fireStick.style.left="35px";
    fireStick.style.top="35px";
});

// ---------------- SHOOT (PC LOGIC ADAPTED) ----------------
function shoot(){
    if(!firing) return;
    if(aimX===0 && aimY===0) return;

    let now=Date.now();
    if(now<fireCooldown) return;
    fireCooldown=now+FIRE_RATE;

    playerBullets.push({
        x:player.x,
        y:player.y,
        size:6,
        speed:8,
        dx:aimX,
        dy:aimY,
        damage:20
    });
}

// ---------------- PC ATTACKS ----------------
function wallAttack(){
    let dir=Math.random()<0.5?-1:1;

    for(let i=0;i<10;i++){
        let y=(canvas.height/10)*i;

        bossProjectiles.push({
            x:dir===1?0:canvas.width,
            y:y,
            size:12,
            speed:5,
            dx:dir,
            dy:0,
            color:"orange"
        });
    }
}

function reflectAttack(){
    currentAttack="reflect";
    setTimeout(()=>currentAttack="idle",1500);
}

function orbitAttack(){
    for(let i=0;i<16;i++){
        let a=orbitAngle+(i*(Math.PI*2/16));

        bossProjectiles.push({
            x:boss.x,
            y:boss.y,
            size:10,
            speed:5,
            dx:Math.cos(a),
            dy:Math.sin(a),
            color:"purple"
        });
    }

    orbitAngle+=0.25;
}

// ---------------- BOSS UPDATE (PC COLORS EXACT) ----------------
function updateBoss(){

    if(currentAttack==="warning") boss.color="yellow";
    else if(currentAttack==="wall") boss.color="red";
    else if(currentAttack==="reflect") boss.color="cyan";
    else if(currentAttack==="orbit") boss.color="purple";
    else boss.color="white";

    boss.angle+=0.02;
    boss.x=boss.centerX+Math.cos(boss.angle)*boss.radius;
    boss.y=boss.centerY+Math.sin(boss.angle)*boss.radius;
}

// ---------------- UPDATE (PC LOGIC) ----------------
function update(){
    if(!gameStarted) return;

    player.x+=moveX*player.speed;
    player.y+=moveY*player.speed;

    updateBoss();
    shoot();

    attackTimer--;

    if(attackTimer===warningTime){
        currentAttack="warning";
    }

    if(attackTimer<=0){

        if(nextAttack==="wall"){
            wallAttack();
            currentAttack="wall";
            nextAttack="reflect";
        }
        else if(nextAttack==="reflect"){
            reflectAttack();
            nextAttack="orbit";
        }
        else{
            orbitAttack();
            currentAttack="orbit";
            nextAttack="wall";
        }

        attackTimer=300;
    }

    // MOVE PROJECTILES (IMPORTANT)
    for(let p of bossProjectiles){
        p.x+=p.dx*p.speed;
        p.y+=p.dy*p.speed;
    }

    for(let b of playerBullets){
        b.x+=b.dx*b.speed;
        b.y+=b.dy*b.speed;

        if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.size){
            boss.hp-=b.damage;
            b.x=-9999;
        }
    }

    if(boss.hp<=0) alert("YOU WIN!");
}

// ---------------- DRAW ----------------
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(!gameStarted){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("TAP TO START",canvas.width/2-120,canvas.height/2);
        return;
    }

    ctx.fillStyle="white";
    ctx.fillRect(player.x,player.y,player.size,player.size);

    ctx.fillStyle=boss.color;
    ctx.fillRect(boss.x,boss.y,boss.size,boss.size);

    for(let p of bossProjectiles){
        ctx.fillStyle=p.color||"red";
        ctx.fillRect(p.x,p.y,p.size,p.size);
    }

    ctx.fillStyle="blue";
    for(let b of playerBullets){
        ctx.fillRect(b.x,b.y,b.size,b.size);
    }

    ctx.fillStyle="gray";
    ctx.fillRect(20,20,200,20);
    ctx.fillStyle="green";
    ctx.fillRect(20,20,(boss.hp/4000)*200,20);
}

// ---------------- LOOP ----------------
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

canvas.addEventListener("touchstart",()=>gameStarted=true);

loop();
</script>

</body>
</html>
