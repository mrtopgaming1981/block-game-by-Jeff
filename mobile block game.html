<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dodge Survival Mobile</title>

<style>
body { margin:0; overflow:hidden; background:black; touch-action:none; }
canvas { display:block; }

/* MOVE JOYSTICK */
#moveBase {
    position:absolute;
    bottom:60px;
    left:60px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
}
#moveStick {
    position:absolute;
    width:50px;
    height:50px;
    background:white;
    border-radius:50%;
    top:35px;
    left:35px;
}

/* FIRE JOYSTICK */
#fireBase {
    position:absolute;
    bottom:60px;
    right:60px;
    width:120px;
    height:120px;
    background:rgba(255,0,0,0.1);
    border-radius:50%;
}
#fireStick {
    position:absolute;
    width:50px;
    height:50px;
    background:red;
    border-radius:50%;
    top:35px;
    left:35px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="moveBase"><div id="moveStick"></div></div>
<div id="fireBase"><div id="fireStick"></div></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;

// ---------------- PLAYER / BOSS ----------------
let player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size:20,
    speed:4
};

let boss = {
    x: canvas.width/2,
    y: canvas.height/2,
    size:80,
    angle:0,
    radius:150,
    centerX:canvas.width/2,
    centerY:canvas.height/2,
    hp:4000
};

let bossProjectiles = [];
let playerBullets = [];

// ---------------- MOVEMENT ----------------
let moveX = 0, moveY = 0;

// ---------------- AIM + FIRE ----------------
let aimX = 0, aimY = 0;
let firing = false;

// 🔥 FIRE RATE FIX
let fireCooldown = 0;
const FIRE_RATE = 200; // ms between shots (adjust like PC feel)

// ---------------- MOVE JOYSTICK ----------------
const moveBase = document.getElementById("moveBase");
const moveStick = document.getElementById("moveStick");

moveBase.addEventListener("touchmove", e => {
    let t = e.touches[0];
    let r = moveBase.getBoundingClientRect();

    let dx = t.clientX - (r.left + 60);
    let dy = t.clientY - (r.top + 60);

    let dist = Math.min(40, Math.hypot(dx,dy));
    let angle = Math.atan2(dy,dx);

    moveX = Math.cos(angle)*(dist/40);
    moveY = Math.sin(angle)*(dist/40);

    moveStick.style.left = 35 + moveX*40 + "px";
    moveStick.style.top = 35 + moveY*40 + "px";
});

moveBase.addEventListener("touchend", () => {
    moveX = moveY = 0;
    moveStick.style.left="35px";
    moveStick.style.top="35px";
});

// ---------------- FIRE JOYSTICK ----------------
const fireBase = document.getElementById("fireBase");
const fireStick = document.getElementById("fireStick");

fireBase.addEventListener("touchstart", () => {
    firing = true;
});

fireBase.addEventListener("touchmove", e => {
    let t = e.touches[0];
    let r = fireBase.getBoundingClientRect();

    let dx = t.clientX - (r.left + 60);
    let dy = t.clientY - (r.top + 60);

    let dist = Math.min(40, Math.hypot(dx,dy));
    let angle = Math.atan2(dy,dx);

    aimX = Math.cos(angle);
    aimY = Math.sin(angle);

    fireStick.style.left = 35 + aimX*40 + "px";
    fireStick.style.top = 35 + aimY*40 + "px";
});

fireBase.addEventListener("touchend", () => {
    firing = false;
    aimX = 0;
    aimY = 0;

    fireStick.style.left="35px";
    fireStick.style.top="35px";
});

// ---------------- SHOOT (FIXED RATE) ----------------
function shoot() {
    if (!firing) return;

    let now = Date.now();
    if (now < fireCooldown) return;

    fireCooldown = now + FIRE_RATE;

    if (aimX === 0 && aimY === 0) return;

    playerBullets.push({
        x: player.x,
        y: player.y,
        size:6,
        speed:8,
        dx:aimX,
        dy:aimY,
        damage:20
    });
}

// ---------------- BOSS ----------------
function updateBoss(){
    boss.angle += 0.02;
    boss.x = boss.centerX + Math.cos(boss.angle)*boss.radius;
    boss.y = boss.centerY + Math.sin(boss.angle)*boss.radius;
}

function randomProjectile(){
    let a = Math.random()*Math.PI*2;

    bossProjectiles.push({
        x:boss.x,
        y:boss.y,
        size:8,
        speed:4,
        dx:Math.cos(a),
        dy:Math.sin(a)
    });
}

// ---------------- UPDATE ----------------
function update(){
    if(!gameStarted) return;

    player.x += moveX*player.speed;
    player.y += moveY*player.speed;

    updateBoss();

    if(Math.random()<0.03) randomProjectile();

    shoot();

    for(let p of bossProjectiles){
        p.x += p.dx*p.speed;
        p.y += p.dy*p.speed;
    }

    for(let b of playerBullets){
        b.x += b.dx*b.speed;
        b.y += b.dy*b.speed;

        if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.size){
            boss.hp -= b.damage;
            b.x = -9999;
        }
    }

    if(boss.hp<=0) alert("YOU WIN!");
}

// ---------------- DRAW ----------------
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(!gameStarted){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("TAP TO START", canvas.width/2-120, canvas.height/2);
        return;
    }

    ctx.fillStyle="white";
    ctx.fillRect(player.x,player.y,player.size,player.size);

    ctx.fillStyle="yellow";
    ctx.fillRect(boss.x,boss.y,boss.size,boss.size);

    ctx.fillStyle="red";
    for(let p of bossProjectiles)
        ctx.fillRect(p.x,p.y,p.size,p.size);

    ctx.fillStyle="blue";
    for(let b of playerBullets)
        ctx.fillRect(b.x,b.y,b.size,b.size);

    ctx.fillStyle="gray";
    ctx.fillRect(20,20,200,20);
    ctx.fillStyle="green";
    ctx.fillRect(20,20,(boss.hp/4000)*200,20);
}

// ---------------- LOOP ----------------
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

canvas.addEventListener("touchstart", ()=>gameStarted=true);

loop();
</script>

</body>
</html>
