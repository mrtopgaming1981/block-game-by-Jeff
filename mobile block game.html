<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dodge Survival Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; touch-action: none; }
        canvas { display: block; }

        #joystickBase {
            position: absolute;
            bottom: 60px;
            left: 60px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        #joystick {
            position: absolute;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            top: 35px;
            left: 35px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="joystickBase"><div id="joystick"></div></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;

const PROJECTILE_SPEED = 5;
const RANDOM_PROJECTILE_CHANCE = 0.03;

let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    speed: 4
};

let boss = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 80,
    angle: 0,
    radius: 150,
    centerX: canvas.width / 2,
    centerY: canvas.height / 2,
    hp: 4000
};

let bossProjectiles = [];
let playerBullets = [];

let moveX = 0;
let moveY = 0;

let joystick = document.getElementById("joystick");
let base = document.getElementById("joystickBase");


// ---------------- JOYSTICK ----------------
base.addEventListener("touchstart", () => {
    dragging = true;
});

base.addEventListener("touchmove", e => {
    let touch = e.touches[0];
    let rect = base.getBoundingClientRect();

    let dx = touch.clientX - (rect.left + 60);
    let dy = touch.clientY - (rect.top + 60);

    let dist = Math.min(40, Math.sqrt(dx*dx + dy*dy));
    let angle = Math.atan2(dy, dx);

    moveX = Math.cos(angle) * (dist / 40);
    moveY = Math.sin(angle) * (dist / 40);

    joystick.style.left = 35 + moveX * 40 + "px";
    joystick.style.top = 35 + moveY * 40 + "px";
});

base.addEventListener("touchend", () => {
    moveX = 0;
    moveY = 0;
    joystick.style.left = "35px";
    joystick.style.top = "35px";
});


// ---------------- SHOOTING ----------------
canvas.addEventListener("touchstart", (e) => {
    if (!gameStarted) {
        gameStarted = true;
        return;
    }

    let touch = e.touches[0];

    // ignore joystick touches
    let target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && (target.id === "joystick" || target.id === "joystickBase")) {
        return;
    }

    shoot(touch);
});

function shoot(touch) {
    let rect = canvas.getBoundingClientRect();

    let targetX = touch.clientX - rect.left;
    let targetY = touch.clientY - rect.top;

    let angle = Math.atan2(targetY - player.y, targetX - player.x);

    playerBullets.push({
        x: player.x,
        y: player.y,
        size: 6,
        speed: 8,
        dx: Math.cos(angle),
        dy: Math.sin(angle),
        damage: 20
    });
}


// ---------------- BOSS ----------------
function randomProjectile() {
    let angle = Math.random() * Math.PI * 2;

    bossProjectiles.push({
        x: boss.x,
        y: boss.y,
        size: 8,
        speed: PROJECTILE_SPEED - 1,
        dx: Math.cos(angle),
        dy: Math.sin(angle)
    });
}

function updateBoss() {
    boss.angle += 0.02;
    boss.x = boss.centerX + Math.cos(boss.angle) * boss.radius;
    boss.y = boss.centerY + Math.sin(boss.angle) * boss.radius;
}


// ---------------- GAME LOOP ----------------
function update() {
    if (!gameStarted) return;

    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    player.x = Math.max(0, Math.min(canvas.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height, player.y));

    updateBoss();

    if (Math.random() < RANDOM_PROJECTILE_CHANCE) {
        randomProjectile();
    }

    for (let p of bossProjectiles) {
        p.x += p.dx * p.speed;
        p.y += p.dy * p.speed;
    }

    for (let b of playerBullets) {
        b.x += b.dx * b.speed;
        b.y += b.dy * b.speed;

        if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.size) {
            boss.hp -= b.damage;
            b.x = -9999;
        }
    }

    if (boss.hp <= 0) alert("YOU WIN!");
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if (!gameStarted) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("TAP TO START", canvas.width/2 - 120, canvas.height/2);
        return;
    }

    ctx.fillStyle = "white";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.fillStyle = "red";
    for (let p of bossProjectiles) {
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    ctx.fillStyle = "blue";
    for (let b of playerBullets) {
        ctx.fillRect(b.x, b.y, b.size, b.size);
    }

    ctx.fillStyle = "yellow";
    ctx.fillRect(boss.x, boss.y, boss.size, boss.size);

    ctx.fillStyle = "gray";
    ctx.fillRect(20,20,200,20);
    ctx.fillStyle = "green";
    ctx.fillRect(20,20,(boss.hp/4000)*200,20);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
